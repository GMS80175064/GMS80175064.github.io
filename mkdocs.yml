site_name: 김민석 (Minseok Gim) Blog
site_author: Minseok Gim
site_url: https://gms80175064.github.io

copyright: Copyright &copy; 2026 Minseok Gim. All rights reserved.

theme:
  name: material
  language: en
  palette:
    # 라이트 모드 설정
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections      # 섹션 구분
    - navigation.top           # 맨 위로 가기 버튼
    - navigation.path          # 상단 경로 표시 (Breadcrumbs)
    - navigation.instant       # 부드러운 페이지 전환 (SPA)
    - content.code.copy        # 코드 한 줄 복사 버튼
    - search.highlight         # 검색어 강조

# 본문 서식 확장 기능 (강조 박스, 코드 블록 등)
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list

plugins:
  - search
  - git-revision-date-localized:
      type: iso_date
      locale: en
      timezone: Asia/Seoul

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GMS80175064
      name: Github
    - icon: fontawesome/brands/google-scholar
      link: https://scholar.google.com/citations?user=70S7O2wAAAA
      name: Google Scholar
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0009-0009-7189-0809
      name: ORCID
    - icon: fontawesome/solid/envelope
      link: mailto:gms80175064@email.com
      name: Personal Email
    - icon: fontawesome/regular/envelope
      link: mailto:Minseok.Gim@uga.edu
      name: Academic Email